replicas: 1

domain: fragmented-keys.noizu.com
frontend:
  # Tag is bumped by CI (bump-chart job); never hand-edit.
  image: ops.noizu.com/fragmented-keys.noizu.com/frontend:sha-be78add
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
imagePullSecrets:
  - name: ops-registry-secret
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  # *.noizu.com wildcard: the CloudFlare Origin Certificate shared across the
  # apps namespace (SANs *.noizu.com + noizu.com, valid to 2040). NOT
  # `cloudflare-tls-synced` — that secret exists only in the `infra` namespace,
  # and referencing it from `apps` leaves the ingress with no usable cert, so
  # Cloudflare rejects the origin handshake with HTTP 526. Every working
  # *.noizu.com site in `apps` (billing, infra-portal, meetme, noizu-site)
  # uses this secret. No per-site Infisical cert, so no tls-secret template.
  secretName: noizu-com-tls
